services:
  - type: web
    name: stocksense-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_app.py"
    envVars:
      - key: ENABLE_LIVE_DATA
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://stocksense-ai.onrender.com"
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
